[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-flow"
version = "0.1.0"
description = "Passive data-flow tracer and dependency graph analyzer across multiple MCP (Model Context Protocol) servers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "stu2230085-maker", email = "stu2230085-maker@users.noreply.github.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "data-flow",
    "taint-tracking",
    "observability",
    "security",
    "json-rpc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
semantic = ["numpy>=1.24.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
mcp-flow = "mcp_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
